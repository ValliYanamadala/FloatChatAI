version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: floatchat_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argo_password}
      POSTGRES_DB: ${POSTGRES_DB:-argo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argo_user} -d ${POSTGRES_DB:-argo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: floatchat_chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local
